name: Build Barzan Keyboard V2 Pro APK
on:
  push:
    branches: [main]
    paths:
      - 'android-v2/**'
      - '.github/workflows/android-v2.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-v2
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Barzan-Keyboard-V2-Pro-APK
          path: android-v2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
